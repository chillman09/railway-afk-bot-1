<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Bot / Your bots</title>
    <link rel="icon" type="image/png" href="/aurora-bot.png">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/pro.css">
    <link rel="stylesheet" href="/ui.css">
    <!--BOOT-->
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand"><img class="brand-mark" src="/aurora-bot.png" alt="Aurora Bot"><span>Aurora Bot</span></div>
        <div class="topbar-meta">
          <a class="admin-link" id="admin-link" href="/admin" hidden>Admin</a>
          <span class="user-chip" id="user-chip">--</span>
          <button class="logout-button" id="logout-button" title="Log out">Log out</button>
        </div>
      </header>
      <div class="head">
        <div><h1 id="title">Your bots</h1><p id="sub">&nbsp;</p></div>
        <form class="redeem" id="redeem-form"><input id="redeem-code" placeholder="Access code, e.g. AUR-XXXX-XXXX" required autocomplete="off" aria-label="Access code"><button class="button button-primary" type="submit">Redeem code</button></form>
      </div>
      <p class="msg" id="redeem-message" role="status"></p>
      <div class="kpis" id="kpis"></div>
      <section class="card"><div class="card-h"><h2>Bots</h2></div><div class="tw" id="list"></div></section>
      <p class="foot-note">Need another bot? Message the admin on Discord to buy an access code.</p>
    </main>
    <script src="/auth-nav.js"></script>
    <script src="/servers.js"></script>
  </body>
</html>
