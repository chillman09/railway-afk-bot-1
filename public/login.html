<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Bot / Sign in</title>
    <link rel="icon" type="image/png" href="/aurora-bot.png">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="login-body">
    <main class="login-shell">
      <div class="login-card">
        <div class="login-brand"><img class="brand-mark" src="/aurora-bot.png" alt="Aurora Bot"><span>Aurora Bot</span></div>
        <h1>Sign in</h1>
        <p class="lede">New here? <a href="/register">Create an account</a>.</p>

        <form id="login-form" class="login-form">
          <label>Username<input id="login-username" autocomplete="username" required></label>
          <label>Password<input id="login-password" type="password" autocomplete="current-password" required></label>
          <button class="button button-primary button-save" type="submit">Sign in <span>→</span></button>
          <p class="form-message" id="login-message"></p>
        </form>
      </div>
      <footer class="footer login-footer"><span>Aurora Bot</span><span>Bots are activated with an access code</span></footer>
    </main>

    <script src="/login.js"></script>
      <script src="/fx.js"></script>
  </body>
</html>
